name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_smoke_failure:
        description: Set FORCE_UNHEALTHY before smoke (gate demo — switch never runs)
        type: boolean
        default: false
      simulate_post_switch_failure:
        description: Set FORCE_UNHEALTHY after switch (soak fails → rollback + Log Analytics)
        type: boolean
        default: false
      simulate_log_errors:
        description: Hit /demo/error after switch (/health stays 200; Log Analytics rollback)
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NAMESPACE: production
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  SIMULATE_SMOKE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_smoke_failure || false }}
  SIMULATE_POST_SWITCH_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_post_switch_failure || false }}
  SIMULATE_LOG_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_log_errors || false }}
  LOG_FAILURE_THRESHOLD: "5"
  LOG_INGESTION_POLL_SECONDS: "20"
  LOG_INGESTION_MAX_WAIT_SECONDS: "360"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  determine-colors:
    name: Determine active and target colors
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    environment:
      name: production

    outputs:
      active_color: ${{ steps.colors.outputs.active_color }}
      target_color: ${{ steps.colors.outputs.target_color }}
      commit_sha: ${{ steps.colors.outputs.commit_sha }}

    steps:
      - name: Reject mutually exclusive failure simulations
        run: |
          COUNT=0
          if [ "${{ env.SIMULATE_SMOKE_FAILURE }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi
          if [ "${{ env.SIMULATE_POST_SWITCH_FAILURE }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi
          if [ "${{ env.SIMULATE_LOG_ERRORS }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi
          if [ "${COUNT}" -gt 1 ]; then
            echo "Error: simulate_smoke_failure, simulate_post_switch_failure, and simulate_log_errors are mutually exclusive"
            exit 1
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Ensure active-color ConfigMap exists
        run: |
          kubectl apply -f kubernetes/production/00-active-color.yaml

      - name: Read active color and compute target
        id: colors
        run: |
          ACTIVE=$(kubectl get configmap active-color \
            -n "${{ env.NAMESPACE }}" \
            -o jsonpath='{.data.active-color}')

          if [ -z "${ACTIVE}" ]; then
            ACTIVE="blue"
          fi

          if [ "${ACTIVE}" = "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi

          echo "active_color=${ACTIVE}" >> "${GITHUB_OUTPUT}"
          echo "target_color=${TARGET}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${{ env.COMMIT_SHA }}" >> "${GITHUB_OUTPUT}"

  deploy-target:
    name: Deploy target color
    runs-on: ubuntu-latest
    needs: determine-colors

    environment:
      name: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-colors.outputs.commit_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply production ServiceMonitors
        run: |
          kubectl apply -f kubernetes/monitoring/production-servicemonitors.yaml

      - name: Create PostgreSQL secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEFAULT_ADMIN_USERNAME: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
          DEFAULT_ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
          DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${DEFAULT_ADMIN_USERNAME}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${DEFAULT_ADMIN_EMAIL}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${DEFAULT_ADMIN_PASSWORD}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${AZURE_STORAGE_CONNECTION_STRING}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Remove legacy single-color Deployments
        run: |
          kubectl delete deployment \
            frontend \
            user-service \
            student-service \
            lecturer-service \
            course-service \
            enrollment-service \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

      - name: Align Service selectors with active and target colors
        env:
          ACTIVE: ${{ needs.determine-colors.outputs.active_color }}
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          SERVICES="frontend user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${SERVICES}; do
            kubectl patch service "${svc}" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${ACTIVE}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${ACTIVE}\"}}}"

            kubectl patch service "${svc}-preview" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${TARGET}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${TARGET}\"}}}"
          done

      - name: Preflight ACR images
        env:
          SHA: ${{ needs.determine-colors.outputs.commit_sha }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          IMAGES="koalatech-frontend koalatech-user-service koalatech-student-service koalatech-lecturer-service koalatech-course-service koalatech-enrollment-service"
          MISSING=0

          for image in ${IMAGES}; do
            if ! az acr repository show \
              --name "${ACR_NAME}" \
              --image "${image}:${SHA}" >/dev/null; then
              echo "Missing ACR image ${image}:${SHA}"
              MISSING=1
            fi
          done

          if [ "${MISSING}" -ne 0 ]; then
            echo "One or more images for ${SHA} are not in ACR — aborting before rollout"
            exit 1
          fi

      - name: Update target images
        env:
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
          SHA: ${{ needs.determine-colors.outputs.commit_sha }}
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          kubectl set image deployment/frontend-"${TARGET}" \
            frontend="${ACR}/koalatech-frontend:${SHA}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/user-service-"${TARGET}" \
            user-service="${ACR}/koalatech-user-service:${SHA}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/student-service-"${TARGET}" \
            student-service="${ACR}/koalatech-student-service:${SHA}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/lecturer-service-"${TARGET}" \
            lecturer-service="${ACR}/koalatech-lecturer-service:${SHA}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/course-service-"${TARGET}" \
            course-service="${ACR}/koalatech-course-service:${SHA}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/enrollment-service-"${TARGET}" \
            enrollment-service="${ACR}/koalatech-enrollment-service:${SHA}" \
            -n "${{ env.NAMESPACE }}"

      - name: Set FORCE_UNHEALTHY on target color
        env:
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          BACKENDS="user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${BACKENDS}; do
            kubectl set env deployment/"${svc}-${TARGET}" \
              ENABLE_DEMO_ERRORS- \
              -n "${{ env.NAMESPACE }}"
          done

          if [ "${{ env.SIMULATE_SMOKE_FAILURE }}" = "true" ]; then
            for svc in ${BACKENDS}; do
              kubectl set env deployment/"${svc}-${TARGET}" \
                FORCE_UNHEALTHY=true \
                -n "${{ env.NAMESPACE }}"
            done
          else
            for svc in ${BACKENDS}; do
              kubectl set env deployment/"${svc}-${TARGET}" \
                FORCE_UNHEALTHY- \
                -n "${{ env.NAMESPACE }}"
            done
          fi

      - name: Wait for target rollouts
        env:
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          DEPLOYMENTS="frontend user-service student-service lecturer-service course-service enrollment-service"
          FAILED=0

          for svc in ${DEPLOYMENTS}; do
            if ! kubectl rollout status deployment/"${svc}-${TARGET}" \
              -n "${{ env.NAMESPACE }}" \
              --timeout=300s; then
              echo "Rollout not ready for ${svc}-${TARGET}"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -ne 0 ]; then
            if [ "${{ env.SIMULATE_SMOKE_FAILURE }}" != "true" ]; then
              exit 1
            fi
          fi

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

  smoke-target:
    name: Smoke test target (preview)
    runs-on: ubuntu-latest
    needs: [determine-colors, deploy-target]

    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Curl preview Services /health
        run: |
          set -euo pipefail

          kubectl delete pod smoke-target-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

          kubectl run smoke-target-curl \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            -n "${{ env.NAMESPACE }}" \
            --command -- sleep 120

          kubectl wait --for=condition=Ready pod/smoke-target-curl \
            -n "${{ env.NAMESPACE }}" \
            --timeout=60s

          set +e
          kubectl exec smoke-target-curl \
            -n "${{ env.NAMESPACE }}" \
            -- sh -c '
              set -e
              fail=0
              check() {
                name="$1"
                url="$2"
                code=$(curl -s -o /tmp/body -w "%{http_code}" "$url" || true)
                if [ "${code}" != "200" ]; then
                  echo "FAIL ${name} HTTP ${code}"
                  cat /tmp/body || true
                  fail=1
                fi
              }
              check frontend-preview-health http://frontend-preview.production.svc.cluster.local/health
              check user-service-preview-health http://user-service-preview.production.svc.cluster.local:8000/health
              check student-service-preview-health http://student-service-preview.production.svc.cluster.local:8000/health
              check lecturer-service-preview-health http://lecturer-service-preview.production.svc.cluster.local:8000/health
              check course-service-preview-health http://course-service-preview.production.svc.cluster.local:8000/health
              check enrollment-service-preview-health http://enrollment-service-preview.production.svc.cluster.local:8000/health
              check frontend-preview-root http://frontend-preview.production.svc.cluster.local/
              check user-service-preview-root http://user-service-preview.production.svc.cluster.local:8000/
              exit "${fail}"
            '
          STATUS=$?
          set -e

          kubectl delete pod smoke-target-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

          exit "${STATUS}"

  switch-traffic:
    name: Switch traffic to target color
    runs-on: ubuntu-latest
    needs: [determine-colors, smoke-target]

    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Patch live and preview Service selectors
        env:
          ACTIVE: ${{ needs.determine-colors.outputs.active_color }}
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          SERVICES="frontend user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${SERVICES}; do
            kubectl patch service "${svc}" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${TARGET}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${TARGET}\"}}}"

            kubectl patch service "${svc}-preview" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${ACTIVE}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${ACTIVE}\"}}}"
          done

      - name: Update active-color ConfigMap
        env:
          TARGET: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          kubectl create configmap active-color \
            -n "${{ env.NAMESPACE }}" \
            --from-literal=active-color="${TARGET}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

  soak-and-rollback:
    name: Soak live traffic and auto-rollback
    runs-on: ubuntu-latest
    needs: [determine-colors, switch-traffic]

    environment:
      name: production

    outputs:
      outcome: ${{ steps.emergency.outputs.outcome || steps.soak.outputs.outcome }}
      live_color: ${{ steps.emergency.outputs.live_color || steps.soak.outputs.live_color }}
      rollback_reason: ${{ steps.emergency.outputs.rollback_reason || steps.soak.outputs.rollback_reason }}
      log_failure_count: ${{ steps.emergency.outputs.log_failure_count || steps.soak.outputs.log_failure_count }}

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Inject post-switch FORCE_UNHEALTHY on live color
        if: env.SIMULATE_POST_SWITCH_FAILURE == 'true'
        env:
          LIVE: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          set -euo pipefail
          BACKENDS="user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${BACKENDS}; do
            kubectl set env deployment/"${svc}-${LIVE}" \
              FORCE_UNHEALTHY=true \
              -n "${{ env.NAMESPACE }}"
          done

          sleep 45

          kubectl delete pod post-switch-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

          kubectl run post-switch-curl \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            -n "${{ env.NAMESPACE }}" \
            --command -- sleep 60

          kubectl wait --for=condition=Ready pod/post-switch-curl \
            -n "${{ env.NAMESPACE }}" \
            --timeout=60s

          kubectl exec post-switch-curl \
            -n "${{ env.NAMESPACE }}" \
            -- sh -c '
              for i in 1 2 3; do
                curl -s -o /dev/null http://user-service.production.svc.cluster.local:8000/health || true
                curl -s -o /dev/null http://student-service.production.svc.cluster.local:8000/health || true
                curl -s -o /dev/null http://lecturer-service.production.svc.cluster.local:8000/health || true
                curl -s -o /dev/null http://course-service.production.svc.cluster.local:8000/health || true
                curl -s -o /dev/null http://enrollment-service.production.svc.cluster.local:8000/health || true
                sleep 2
              done
            ' || true

          kubectl delete pod post-switch-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

      - name: Enable demo error route on live color
        if: env.SIMULATE_LOG_ERRORS == 'true'
        env:
          LIVE: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          set -euo pipefail
          BACKENDS="user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${BACKENDS}; do
            kubectl set env deployment/"${svc}-${LIVE}" \
              ENABLE_DEMO_ERRORS=true \
              -n "${{ env.NAMESPACE }}"
          done

          for svc in ${BACKENDS}; do
            kubectl rollout status deployment/"${svc}-${LIVE}" \
              -n "${{ env.NAMESPACE }}" \
              --timeout=180s
          done

      - name: Soak live /health for 90s
        id: soak
        env:
          PREVIOUS: ${{ needs.determine-colors.outputs.active_color }}
          LIVE: ${{ needs.determine-colors.outputs.target_color }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
          LOG_FAILURE_THRESHOLD: ${{ env.LOG_FAILURE_THRESHOLD }}
          LOG_INGESTION_POLL_SECONDS: ${{ env.LOG_INGESTION_POLL_SECONDS }}
          LOG_INGESTION_MAX_WAIT_SECONDS: ${{ env.LOG_INGESTION_MAX_WAIT_SECONDS }}
          SIMULATE_LOG_ERRORS: ${{ env.SIMULATE_LOG_ERRORS }}
        run: |
          set -euo pipefail

          write_summary() {
            printf '%s\n' \
              "## Production deploy" \
              "" \
              "| Field | Value |" \
              "|---|---|" \
              "| Live color | $1 |" \
              "| Outcome | $2 |" \
              "| SHA | ${COMMIT_SHA} |" \
              "| Log failures | $3 |" \
              "| Reason | $4 |" \
              "" \
              "[Open this run](${RUN_URL})" \
              >> "${GITHUB_STEP_SUMMARY}"
          }

          SWITCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          THRESHOLD="${LOG_FAILURE_THRESHOLD:-5}"
          POLL_SECONDS="${LOG_INGESTION_POLL_SECONDS:-20}"
          MAX_WAIT="${LOG_INGESTION_MAX_WAIT_SECONDS:-360}"
          SOAK_FAILED=0
          ROLLBACK_REASON=""
          LOG_FAILURE_COUNT="unavailable"

          echo "live_color=${LIVE}" >> "${GITHUB_OUTPUT}"

          kubectl delete pod soak-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

          kubectl run soak-curl \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            -n "${{ env.NAMESPACE }}" \
            --command -- sleep 180

          kubectl wait --for=condition=Ready pod/soak-curl \
            -n "${{ env.NAMESPACE }}" \
            --timeout=60s

          if [ "${SIMULATE_LOG_ERRORS}" = "true" ]; then
            kubectl exec soak-curl \
              -n "${{ env.NAMESPACE }}" \
              -- sh -c '
                for i in 1 2 3; do
                  curl -s -o /dev/null http://user-service.production.svc.cluster.local:8000/demo/error || true
                  curl -s -o /dev/null http://student-service.production.svc.cluster.local:8000/demo/error || true
                  curl -s -o /dev/null http://lecturer-service.production.svc.cluster.local:8000/demo/error || true
                  curl -s -o /dev/null http://course-service.production.svc.cluster.local:8000/demo/error || true
                  curl -s -o /dev/null http://enrollment-service.production.svc.cluster.local:8000/demo/error || true
                  sleep 1
                done
              ' || true
          fi

          END=$((SECONDS + 90))

          while [ "${SECONDS}" -lt "${END}" ]; do
            set +e
            kubectl exec soak-curl \
              -n "${{ env.NAMESPACE }}" \
              -- sh -c '
                fail=0
                check() {
                  name="$1"
                  url="$2"
                  code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
                  if [ "${code}" != "200" ]; then
                    echo "FAIL ${name} HTTP ${code}"
                    fail=1
                  fi
                }
                check frontend http://frontend.production.svc.cluster.local/health
                check user-service http://user-service.production.svc.cluster.local:8000/health
                check student-service http://student-service.production.svc.cluster.local:8000/health
                check lecturer-service http://lecturer-service.production.svc.cluster.local:8000/health
                check course-service http://course-service.production.svc.cluster.local:8000/health
                check enrollment-service http://enrollment-service.production.svc.cluster.local:8000/health
                exit "${fail}"
              '
            STATUS=$?
            set -e

            if [ "${STATUS}" -ne 0 ]; then
              SOAK_FAILED=1
              ROLLBACK_REASON="health-soak"
              break
            fi

            sleep 10
          done

          SOAK_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          kubectl delete pod soak-curl \
            -n "${{ env.NAMESPACE }}" \
            --ignore-not-found

          if [ "${SOAK_FAILED}" -eq 0 ]; then
            az extension add --name log-analytics --upgrade --yes >/dev/null 2>&1 || true

            WORKSPACE_NAME="${AKS_CLUSTER_NAME}-logs"

            set +e
            WORKSPACE_ID=$(az monitor log-analytics workspace show \
              --resource-group "${AKS_RESOURCE_GROUP}" \
              --workspace-name "${WORKSPACE_NAME}" \
              --query customerId -o tsv 2>&1)
            LOOKUP_STATUS=$?
            set -e

            if [ "${LOOKUP_STATUS}" -ne 0 ] || [ -z "${WORKSPACE_ID}" ]; then
              echo "::warning::Log Analytics check unavailable"
            else
              QUERY=$(cat <<EOF
          ContainerLogV2
          | where TimeGenerated > datetime(${SWITCH_TIME})
          | where PodNamespace == "production"
          | where PodName matches regex @"-${LIVE}-"
          | summarize Total=count(), FailureCount=countif(LogMessage matches regex @"HTTP/[0-9.]+""\s+5[0-9]{2}\b| - ERROR - | - CRITICAL - "), Latest=max(TimeGenerated)
          EOF
              )

              LOGS_READY=0
              POLL_DEADLINE=$((SECONDS + MAX_WAIT))

              while [ "${SECONDS}" -lt "${POLL_DEADLINE}" ]; do
                set +e
                RESULT=$(az monitor log-analytics query \
                  --workspace "${WORKSPACE_ID}" \
                  --analytics-query "${QUERY}" \
                  --timespan PT30M \
                  -o json 2>&1)
                QUERY_STATUS=$?
                set -e

                if [ "${QUERY_STATUS}" -ne 0 ]; then
                  sleep "${POLL_SECONDS}"
                  continue
                fi

                COUNT=$(echo "${RESULT}" | jq -r '
                  if type == "array" and length > 0 then
                    (.[0].FailureCount // .[0].Count // .[0].failureCount // empty)
                  else
                    empty
                  end
                ')
                TOTAL=$(echo "${RESULT}" | jq -r '
                  if type == "array" and length > 0 then
                    (.[0].Total // empty)
                  else
                    empty
                  end
                ')
                LATEST=$(echo "${RESULT}" | jq -r '
                  if type == "array" and length > 0 then
                    (.[0].Latest // empty)
                  else
                    empty
                  end
                ')

                if [ -z "${LATEST}" ] || [ "${LATEST}" = "null" ]; then
                  sleep "${POLL_SECONDS}"
                  continue
                fi

                set +e
                LATEST_EPOCH=$(date -u -d "${LATEST}" +%s 2>/dev/null)
                SOAK_END_EPOCH=$(date -u -d "${SOAK_END}" +%s 2>/dev/null)
                DATE_STATUS=$?
                set -e

                if [ "${DATE_STATUS}" -ne 0 ] || [ -z "${LATEST_EPOCH}" ] || [ -z "${SOAK_END_EPOCH}" ]; then
                  sleep "${POLL_SECONDS}"
                  continue
                fi

                if [ "${LATEST_EPOCH}" -lt $((SOAK_END_EPOCH - 45)) ]; then
                  sleep "${POLL_SECONDS}"
                  continue
                fi

                LOGS_READY=1
                break
              done

              if [ "${LOGS_READY}" -ne 1 ]; then
                echo "::warning::Log Analytics check unavailable"
              elif ! [[ "${COUNT}" =~ ^[0-9]+$ ]]; then
                echo "::warning::Log Analytics check unavailable"
              else
                LOG_FAILURE_COUNT="${COUNT}"
                RATE="n/a"
                if [[ "${TOTAL}" =~ ^[0-9]+$ ]] && [ "${TOTAL}" -gt 0 ]; then
                  RATE=$(awk -v f="${COUNT}" -v t="${TOTAL}" 'BEGIN { printf "%.1f", (f / t) * 100 }')
                fi
                if [ "${COUNT}" -gt "${THRESHOLD}" ]; then
                  SOAK_FAILED=1
                  ROLLBACK_REASON="log-analytics: ${COUNT} failures > threshold ${THRESHOLD} (rate ${RATE}%)"
                fi
              fi
            fi
          fi

          echo "rollback_reason=${ROLLBACK_REASON}" >> "${GITHUB_OUTPUT}"
          echo "log_failure_count=${LOG_FAILURE_COUNT}" >> "${GITHUB_OUTPUT}"

          if [ "${SOAK_FAILED}" -eq 0 ]; then
            echo "outcome=success" >> "${GITHUB_OUTPUT}"
            write_summary "${LIVE}" "success" "${LOG_FAILURE_COUNT}" "none"
            exit 0
          fi

          SERVICES="frontend user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${SERVICES}; do
            kubectl patch service "${svc}" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${PREVIOUS}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${PREVIOUS}\"}}}"

            kubectl patch service "${svc}-preview" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${LIVE}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${LIVE}\"}}}"
          done

          kubectl create configmap active-color \
            -n "${{ env.NAMESPACE }}" \
            --from-literal=active-color="${PREVIOUS}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "outcome=rollback" >> "${GITHUB_OUTPUT}"
          echo "live_color=${PREVIOUS}" >> "${GITHUB_OUTPUT}"
          write_summary "${PREVIOUS}" "rollback" "${LOG_FAILURE_COUNT}" "${ROLLBACK_REASON}"
          exit 0

      - name: Emergency rollback if soak step errored
        id: emergency
        if: failure() && steps.soak.conclusion != 'success'
        env:
          PREVIOUS: ${{ needs.determine-colors.outputs.active_color }}
          LIVE: ${{ needs.determine-colors.outputs.target_color }}
        run: |
          set -euo pipefail
          SERVICES="frontend user-service student-service lecturer-service course-service enrollment-service"

          for svc in ${SERVICES}; do
            kubectl patch service "${svc}" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${PREVIOUS}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${PREVIOUS}\"}}}"

            kubectl patch service "${svc}-preview" \
              -n "${{ env.NAMESPACE }}" \
              --type merge \
              -p "{\"metadata\":{\"labels\":{\"version\":\"${LIVE}\"}},\"spec\":{\"selector\":{\"app\":\"${svc}\",\"version\":\"${LIVE}\"}}}"
          done

          kubectl create configmap active-color \
            -n "${{ env.NAMESPACE }}" \
            --from-literal=active-color="${PREVIOUS}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "outcome=rollback" >> "${GITHUB_OUTPUT}"
          echo "live_color=${PREVIOUS}" >> "${GITHUB_OUTPUT}"
          echo "rollback_reason=soak-step-error" >> "${GITHUB_OUTPUT}"
          echo "log_failure_count=unavailable" >> "${GITHUB_OUTPUT}"
          printf '%s\n' \
            "## Production deploy" \
            "" \
            "| Field | Value |" \
            "|---|---|" \
            "| Live color | ${PREVIOUS} |" \
            "| Outcome | rollback |" \
            "| SHA | ${COMMIT_SHA} |" \
            "| Log failures | unavailable |" \
            "| Reason | soak-step-error |" \
            "" \
            "[Open this run](${RUN_URL})" \
            >> "${GITHUB_STEP_SUMMARY}"

  notify:
    name: Discord notification
    runs-on: ubuntu-latest
    needs:
      - determine-colors
      - deploy-target
      - smoke-target
      - switch-traffic
      - soak-and-rollback
    if: always()

    steps:
      - name: Write job summary
        if: always()
        env:
          OUTCOME: ${{ needs.soak-and-rollback.outputs.outcome }}
          LIVE_COLOR: ${{ needs.soak-and-rollback.outputs.live_color || needs.determine-colors.outputs.active_color || 'unknown' }}
          NOTIFY_SHA: ${{ needs.determine-colors.outputs.commit_sha || env.COMMIT_SHA }}
          LOG_FAILURE_COUNT: ${{ needs.soak-and-rollback.outputs.log_failure_count }}
          ROLLBACK_REASON: ${{ needs.soak-and-rollback.outputs.rollback_reason }}
        run: |
          set -euo pipefail

          if [ "${OUTCOME}" = "success" ]; then
            OUTCOME_VALUE="success"
            REASON="none"
          elif [ "${OUTCOME}" = "rollback" ]; then
            OUTCOME_VALUE="rollback"
            REASON="${ROLLBACK_REASON:-unknown}"
          else
            OUTCOME_VALUE="hard-failure"
            REASON="deploy aborted before or during switch"
          fi

          COUNT_VALUE="${LOG_FAILURE_COUNT:-unavailable}"
          if [ -z "${COUNT_VALUE}" ]; then
            COUNT_VALUE="unavailable"
          fi

          printf '%s\n' \
            "## Production deploy" \
            "" \
            "| Field | Value |" \
            "|---|---|" \
            "| Live color | ${LIVE_COLOR} |" \
            "| Outcome | ${OUTCOME_VALUE} |" \
            "| SHA | ${NOTIFY_SHA} |" \
            "| Log failures | ${COUNT_VALUE} |" \
            "| Reason | ${REASON} |" \
            "" \
            "[Open this run](${RUN_URL})" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify success
        if: >
          needs.soak-and-rollback.result == 'success' &&
          needs.soak-and-rollback.outputs.outcome == 'success'
        env:
          LIVE_COLOR: ${{ needs.soak-and-rollback.outputs.live_color }}
          COMMIT_SHA: ${{ needs.determine-colors.outputs.commit_sha }}
          LOG_FAILURE_COUNT: ${{ needs.soak-and-rollback.outputs.log_failure_count }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          COUNT_VALUE="${LOG_FAILURE_COUNT:-unavailable}"
          if [ -z "${COUNT_VALUE}" ]; then
            COUNT_VALUE="unavailable"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "Production deploy succeeded",
              "color": 3066993,
              "fields": [
                {"name": "Status", "value": "Blue/green switch completed and soak passed (no failure simulation)", "inline": false},
                {"name": "Scenario", "value": "normal deploy", "inline": true},
                {"name": "Live color", "value": "${LIVE_COLOR}", "inline": true},
                {"name": "Commit SHA", "value": "${COMMIT_SHA}", "inline": true},
                {"name": "Log failures", "value": "${COUNT_VALUE}", "inline": true},
                {"name": "Run", "value": "[Open workflow](${RUN_URL})", "inline": false}
              ]
            }]
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_URL}")

          if [ "${HTTP_CODE}" != "204" ]; then
            echo "Warning: Discord webhook returned HTTP ${HTTP_CODE} (expected 204)"
          fi

      - name: Notify rollback
        if: needs.soak-and-rollback.outputs.outcome == 'rollback'
        env:
          LIVE_COLOR: ${{ needs.soak-and-rollback.outputs.live_color }}
          COMMIT_SHA: ${{ needs.determine-colors.outputs.commit_sha }}
          ROLLBACK_REASON: ${{ needs.soak-and-rollback.outputs.rollback_reason }}
          LOG_FAILURE_COUNT: ${{ needs.soak-and-rollback.outputs.log_failure_count }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          REASON="${ROLLBACK_REASON:-unknown}"

          if [ "${REASON}" = "health-soak" ] && [ "${{ env.SIMULATE_POST_SWITCH_FAILURE }}" = "true" ]; then
            STATUS_TEXT="Post-switch failure simulation — live color marked unhealthy after switch; soak failed and traffic reverted"
            SCENARIO="simulate_post_switch_failure (rollback demo)"
            TITLE="Production deploy rolled back (post-switch failure)"
          elif [[ "${REASON}" == log-analytics* ]] && [ "${{ env.SIMULATE_LOG_ERRORS }}" = "true" ]; then
            STATUS_TEXT="Log Analytics failure simulation — /health stayed 200; error/5xx logs exceeded threshold and traffic reverted"
            SCENARIO="simulate_log_errors (Log Analytics rollback demo)"
            TITLE="Production deploy rolled back (Log Analytics)"
          elif [ "${REASON}" = "soak-step-error" ]; then
            STATUS_TEXT="Soak step errored after switch — emergency rollback restored the previous color"
            SCENARIO="soak-step-error"
            TITLE="Production deploy rolled back (soak step error)"
          else
            STATUS_TEXT="Post-switch soak failed — traffic reverted to previous color"
            SCENARIO="unplanned soak failure"
            TITLE="Production deploy rolled back"
          fi
          COUNT_FIELD=""
          if [[ "${REASON}" == log-analytics* ]] && [ -n "${LOG_FAILURE_COUNT}" ] && [ "${LOG_FAILURE_COUNT}" != "unavailable" ]; then
            COUNT_FIELD=',{"name": "Log failures", "value": "'"${LOG_FAILURE_COUNT}"'", "inline": true}'
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "color": 15158332,
              "fields": [
                {"name": "Status", "value": "${STATUS_TEXT}", "inline": false},
                {"name": "Reason", "value": "${REASON}", "inline": false},
                {"name": "Scenario", "value": "${SCENARIO}", "inline": true},
                {"name": "Live color", "value": "${LIVE_COLOR}", "inline": true},
                {"name": "Commit SHA", "value": "${COMMIT_SHA}", "inline": true},
                {"name": "Run", "value": "[Open workflow](${RUN_URL})", "inline": false}
                ${COUNT_FIELD}
              ]
            }]
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_URL}")

          if [ "${HTTP_CODE}" != "204" ]; then
            echo "Warning: Discord webhook returned HTTP ${HTTP_CODE} (expected 204)"
          fi

      - name: Notify hard failure
        if: >
          needs.determine-colors.result == 'failure' ||
          needs.deploy-target.result == 'failure' ||
          needs.smoke-target.result == 'failure' ||
          needs.switch-traffic.result == 'failure' ||
          (needs.soak-and-rollback.result == 'failure' &&
           needs.soak-and-rollback.outputs.outcome != 'rollback')
        env:
          LIVE_COLOR: ${{ needs.determine-colors.outputs.active_color || 'unknown' }}
          COMMIT_SHA: ${{ needs.determine-colors.outputs.commit_sha || env.COMMIT_SHA }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ "${{ env.SIMULATE_SMOKE_FAILURE }}" = "true" ]; then
            STATUS_TEXT="Smoke gate failure simulation — FORCE_UNHEALTHY set pre-smoke; switch-traffic never ran; live traffic unchanged"
            SCENARIO="simulate_smoke_failure (gate demo)"
            TITLE="Production deploy failed (smoke gate)"
          else
            STATUS_TEXT="Deploy aborted before or during switch — live traffic unchanged"
            SCENARIO="hard failure"
            TITLE="Production deploy failed"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "color": 15158332,
              "fields": [
                {"name": "Status", "value": "${STATUS_TEXT}", "inline": false},
                {"name": "Scenario", "value": "${SCENARIO}", "inline": true},
                {"name": "Live color", "value": "${LIVE_COLOR}", "inline": true},
                {"name": "Commit SHA", "value": "${COMMIT_SHA}", "inline": true},
                {"name": "Run", "value": "[Open workflow](${RUN_URL})", "inline": false}
              ]
            }]
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_URL}")

          if [ "${HTTP_CODE}" != "204" ]; then
            echo "Warning: Discord webhook returned HTTP ${HTTP_CODE} (expected 204)"
          fi
