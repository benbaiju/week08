name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend /health
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            "http://${{ env.FRONTEND_IP }}/health"

      - name: Test staging services /health
        run: |
          set -euo pipefail

          kubectl delete pod staging-smoke-curl \
            -n staging \
            --ignore-not-found

          kubectl run staging-smoke-curl \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            -n staging \
            --command -- sleep 120

          kubectl wait --for=condition=Ready pod/staging-smoke-curl \
            -n staging \
            --timeout=60s

          set +e
          kubectl exec staging-smoke-curl \
            -n staging \
            -- sh -c '
              fail=0
              check() {
                name="$1"
                url="$2"
                code=$(curl -s -o /tmp/body -w "%{http_code}" "$url" || true)
                echo "${name}: HTTP ${code}"
                if [ "${code}" != "200" ]; then
                  echo "FAIL ${name} — expected 200"
                  cat /tmp/body || true
                  fail=1
                fi
              }
              check frontend http://frontend.staging.svc.cluster.local/health
              check user-service http://user-service.staging.svc.cluster.local:8000/health
              check student-service http://student-service.staging.svc.cluster.local:8000/health
              check lecturer-service http://lecturer-service.staging.svc.cluster.local:8000/health
              check course-service http://course-service.staging.svc.cluster.local:8000/health
              check enrollment-service http://enrollment-service.staging.svc.cluster.local:8000/health
              exit "${fail}"
            '
          STATUS=$?
          set -e

          kubectl delete pod staging-smoke-curl \
            -n staging \
            --ignore-not-found

          exit "${STATUS}"
