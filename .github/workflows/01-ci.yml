name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
  
  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      TFSTATE_RG: ${{ vars.TFSTATE_RG }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_LOCATION: australiaeast

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bootstrap Terraform state storage
        run: |
          set -euo pipefail

          if ! az group show --name "${TFSTATE_RG}" >/dev/null 2>&1; then
            az group create \
              --name "${TFSTATE_RG}" \
              --location "${TFSTATE_LOCATION}"
          fi

          if ! az storage account show \
            --name "${TFSTATE_STORAGE_ACCOUNT}" \
            --resource-group "${TFSTATE_RG}" >/dev/null 2>&1; then
            az storage account create \
              --name "${TFSTATE_STORAGE_ACCOUNT}" \
              --resource-group "${TFSTATE_RG}" \
              --location "${TFSTATE_LOCATION}" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi

      - name: Get Terraform state storage access key
        id: tfstate-key
        run: |
          set -euo pipefail

          ACCESS_KEY="$(az storage account keys list \
            --resource-group "${TFSTATE_RG}" \
            --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --query "[0].value" -o tsv)"

          echo "::add-mask::${ACCESS_KEY}"
          {
            echo "access_key<<EOF"
            echo "${ACCESS_KEY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create Terraform state container
        env:
          TFSTATE_ACCESS_KEY: ${{ steps.tfstate-key.outputs.access_key }}
        run: |
          set -euo pipefail

          if ! az storage container show \
            --name "${TFSTATE_CONTAINER}" \
            --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --account-key "${TFSTATE_ACCESS_KEY}" >/dev/null 2>&1; then
            az storage container create \
              --name "${TFSTATE_CONTAINER}" \
              --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
              --account-key "${TFSTATE_ACCESS_KEY}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init, validate, and plan
        working-directory: terraform
        env:
          TFSTATE_ACCESS_KEY: ${{ steps.tfstate-key.outputs.access_key }}
        run: |
          set -euo pipefail

          export ARM_CLIENT_ID="$(jq -r '.clientId' <<< "${AZURE_CREDENTIALS}")"
          export ARM_CLIENT_SECRET="$(jq -r '.clientSecret' <<< "${AZURE_CREDENTIALS}")"
          export ARM_SUBSCRIPTION_ID="$(jq -r '.subscriptionId' <<< "${AZURE_CREDENTIALS}")"
          export ARM_TENANT_ID="$(jq -r '.tenantId' <<< "${AZURE_CREDENTIALS}")"

          terraform init \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="access_key=${TFSTATE_ACCESS_KEY}"

          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Terraform apply
        working-directory: terraform
        run: |
          set -euo pipefail

          export ARM_CLIENT_ID="$(jq -r '.clientId' <<< "${AZURE_CREDENTIALS}")"
          export ARM_CLIENT_SECRET="$(jq -r '.clientSecret' <<< "${AZURE_CREDENTIALS}")"
          export ARM_SUBSCRIPTION_ID="$(jq -r '.subscriptionId' <<< "${AZURE_CREDENTIALS}")"
          export ARM_TENANT_ID="$(jq -r '.tenantId' <<< "${AZURE_CREDENTIALS}")"

          terraform apply -auto-approve tfplan


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: terraform

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test:run


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - terraform
      - backend-test
      - frontend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

  docker-scout:
    name: Docker Scout ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: koalatech-frontend
          - image: koalatech-user-service
          - image: koalatech-student-service
          - image: koalatech-lecturer-service
          - image: koalatech-course-service
          - image: koalatech-enrollment-service

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          sarif-file: docker-scout-${{ matrix.image }}.sarif
          summary: true
          write-comment: false
          exit-code: false

      - name: Upload Docker Scout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-${{ matrix.image }}
          path: docker-scout-${{ matrix.image }}.sarif
          if-no-files-found: warn
