apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
        - name: course-service
          image: benbaijuweek09acr.azurecr.io/koalatech-course-service:cdbdc4452443077304f6b367e7ce562a63f291b0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: courses
            - name: POSTGRES_HOST
              value: course-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: HS256

---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: staging
spec:
  selector:
    app: course-service
  ports:
    - port: 8000
      targetPort: 8000