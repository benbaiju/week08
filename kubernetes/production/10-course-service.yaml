---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: production
  labels:
    app: course-service
    version: blue
spec:
  selector:
    app: course-service
    version: blue
  ports:
    - name: http
      port: 8000
      targetPort: 8000

